[project]
name = "fooey"
version = "0.1.0"
description = "A git-aware file browser TUI with live watching, fuzzy search, and diff preview"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
    "dulwich>=0.22.7",
    "watchdog>=6.0.0",
    "rapidfuzz>=3.14.0",
]

[project.scripts]
fooey = "fooey.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fooey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "textual-dev>=1.0",
]
