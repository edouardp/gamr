[project]
name = "gamr"
version = "0.1.10"
description = "Git-aware Agent Monitor & Review — a TUI for reviewing AI agent work"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Edouard Poor"}]
dependencies = [
    "textual>=1.0.0",
    "dulwich>=0.22.7",
    "watchdog>=6.0.0",
    "rapidfuzz>=3.14.0",
]

[project.scripts]
gamr = "gamr.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "textual-dev>=1.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gamr"]
